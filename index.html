<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中秋二选一</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17142a;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    canvas {
      display: block;
      width: min(100vw, 940px);
      height: auto;
      aspect-ratio: 940 / 660;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="940" height="660"></canvas>

  <script>
    const W = 940;
    const H = 660;
    const FONT = '"Microsoft YaHei", "PingFang SC", sans-serif';

    const POPUP_SPEED = 220;
    const FOOTER_REVEAL_TIME = 1.25;

    const THEMES = {
      moon: {
        button: "选这份月光",
        title: "月满人安，万事胜意",
        footer: "愿月光所至皆是安宁，所念之人皆在身旁",
        bg1: [28, 31, 78],
        bg2: [72, 60, 118],
        card: "#fff2bd",
        accent: "#ffd166",
        shape: "circle",
        blessings: [
          "月圆人安",
          "团圆美满",
          "喜乐常在",
          "万事胜意",
          "平安顺遂",
          "好运满月",
          "心愿发光",
          "温柔常伴",
          "桂香入梦",
          "诸事圆满",
          "日日有光",
          "岁岁欢喜"
        ]
      },
      heart: {
        button: "选这颗月饼",
        title: "甜甜圆圆，被爱包围",
        footer: "愿你眉间有笑，心上有甜，日日都被温柔以待",
        bg1: [54, 25, 58],
        bg2: [118, 53, 86],
        card: "#ffe0ea",
        accent: "#ef476f",
        shape: "heart",
        blessings: [
          "甜蜜加满",
          "快乐爆棚",
          "被爱包围",
          "惊喜不断",
          "烦恼退散",
          "好运夹心",
          "笑口常开",
          "心想事成",
          "热爱长久",
          "幸福靠近",
          "好运咬一口",
          "日日很甜"
        ]
      }
    };

    const CONFETTI = [
      "#ffd166",
      "#ef476f",
      "#06d6a0",
      "#118ab2",
      "#ffafcc",
      "#ffffff",
      "#cdb4db",
      "#fdffb6"
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let mode = "choice";
    let themeKey = "moon";
    let theme = THEMES[themeKey];

    let mouseX = -1;
    let mouseY = -1;
    let started = performance.now() / 1000;
    let lastBurst = 0;
    let formationEnd = 0;

    let particles = [];
    let popups = [];

    const mainCards = [
      ["moon", 150, 325, 280, 152],
      ["heart", 510, 325, 280, 152]
    ];

    const backBtn = [18, H - 70, 92, 52];

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function ease(value) {
      value = clamp(value, 0, 1);
      return 1 - Math.pow(1 - value, 3);
    }

    function hexToRgb(color) {
      return {
        r: parseInt(color.slice(1, 3), 16),
        g: parseInt(color.slice(3, 5), 16),
        b: parseInt(color.slice(5, 7), 16)
      };
    }

    function blendColor(colorA, colorB, amount) {
      amount = clamp(amount, 0, 1);

      const a = Array.isArray(colorA)
        ? { r: colorA[0], g: colorA[1], b: colorA[2] }
        : hexToRgb(colorA);

      const b = Array.isArray(colorB)
        ? { r: colorB[0], g: colorB[1], b: colorB[2] }
        : hexToRgb(colorB);

      const r = Math.round(a.r + (b.r - a.r) * amount);
      const g = Math.round(a.g + (b.g - a.g) * amount);
      const bValue = Math.round(a.b + (b.b - a.b) * amount);

      return `rgb(${r}, ${g}, ${bValue})`;
    }

    function roundedRect(x, y, width, height, radius, fill) {
      const r = Math.min(radius, width / 2, height / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - r,
        y + height
      );
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();

      ctx.fillStyle = fill;
      ctx.fill();
    }

    function shapePoint(kind, index, total) {
      if (kind === "circle") {
        const ring = index % 4;
        const angle = (index / total) * Math.PI * 2 * 2;
        const radius = [65, 105, 145, 185][ring];

        return {
          x: W / 2 + Math.cos(angle) * radius,
          y: H / 2 + Math.sin(angle) * radius
        };
      }

      const t = (index / total) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return {
        x: W / 2 + x * 14,
        y: H / 2 - y * 14
      };
    }

    class Particle {
      constructor(x, y, currentTheme) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 7;

        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 45 + Math.random() * 45;
        this.size = 3 + Math.random() * 4;
        this.color = [
          currentTheme.accent,
          ...CONFETTI
        ][Math.floor(Math.random() * (CONFETTI.length + 1))];
      }

      update(dt) {
        const frameScale = dt * 60;

        this.vy += 0.055 * frameScale;
        this.vx *= Math.pow(0.985, frameScale);
        this.vy *= Math.pow(0.985, frameScale);

        this.x += this.vx * frameScale;
        this.y += this.vy * frameScale;
        this.life -= frameScale;

        return this.life > 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    class BlessingPopup {
      constructor(text, currentTheme, target, index) {
        this.text = text;
        this.theme = currentTheme;
        this.index = index;

        this.w = 112 + Math.random() * 42;
        this.h = 38 + Math.random() * 10;

        this.tx = target.x - this.w / 2;
        this.ty = target.y - this.h / 2;

        const side = ["l", "r", "t", "b"][
          Math.floor(Math.random() * 4)
        ];

        if (side === "l") {
          this.sx = -this.w - 20 - Math.random() * 120;
          this.sy = 100 + Math.random() * (H - 210);
        } else if (side === "r") {
          this.sx = W + 20 + Math.random() * 120;
          this.sy = 100 + Math.random() * (H - 210);
        } else if (side === "t") {
          this.sx = 80 + Math.random() * (W - this.w - 160);
          this.sy = -this.h - 20 - Math.random() * 100;
        } else {
          this.sx = 80 + Math.random() * (W - this.w - 160);
          this.sy = H + 20 + Math.random() * 100;
        }

        const dx = this.tx - this.sx;
        const dy = this.ty - this.sy;
        this.distance = Math.hypot(dx, dy) || 1;

        this.dirX = dx / this.distance;
        this.dirY = dy / this.distance;

        this.x = this.sx;
        this.y = this.sy;
        this.arrived = false;
        this.phase = Math.random() * Math.PI * 2;

        this.color = [
          "#fff7d6",
          "#ffe3ec",
          "#e0fbfc",
          "#e8f7d4",
          "#f2e9ff"
        ][Math.floor(Math.random() * 5)];
      }

      update(age) {
        const travelDistance = Math.min(
          POPUP_SPEED * age,
          this.distance
        );

        this.x = this.sx + this.dirX * travelDistance;
        this.y = this.sy + this.dirY * travelDistance;

        if (travelDistance >= this.distance) {
          this.arrived = true;
          this.y =
            this.ty + Math.sin(age * 1.8 + this.phase) * 1.4;
        }
      }

      draw(age) {
        const scale = this.arrived
          ? 1 + Math.sin(age * 1.8 + this.phase) * 0.012
          : 1;

        const width = this.w * scale;
        const height = this.h * scale;
        const x = this.x + (this.w - width) / 2;
        const y = this.y + (this.h - height) / 2;

        roundedRect(x + 5, y + 6, width, height, 9, "#17142a");
        roundedRect(x, y, width, height, 9, this.color);

        ctx.fillStyle = this.theme.accent;
        ctx.fillRect(x, y, width, 6);

        ctx.fillStyle = "#332536";
        ctx.font = `bold ${Math.max(10, Math.floor(13 * scale))}px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.text, x + width / 2, y + height / 2 + 2);
      }
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * (W / rect.width),
        y: (event.clientY - rect.top) * (H / rect.height)
      };
    }

    function isInside(x, y, width, height, pointX, pointY) {
      return (
        pointX >= x &&
        pointX <= x + width &&
        pointY >= y &&
        pointY <= y + height
      );
    }

    function firework(x, y, count = 80) {
      if (x == null) {
        x = 90 + Math.random() * (W - 180);
      }

      if (y == null) {
        y = 90 + Math.random() * (H / 2 - 90);
      }

      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, theme));
      }
    }

    function addPopup(index = null, total = 48) {
      if (index === null) {
        index = Math.floor(Math.random() * total);
      }

      const target = shapePoint(theme.shape, index, total);
      const text =
        theme.blessings[index % theme.blessings.length];

      popups.push(
        new BlessingPopup(text, theme, target, index)
      );
    }

    function startTheme(key, x, y) {
      mode = "show";
      themeKey = key;
      theme = THEMES[key];
      started = performance.now() / 1000;

      particles = [];
      popups = [];
      lastBurst = 0;

      x = x == null ? W / 2 : x;
      y = y == null ? H / 2 : y;

      firework(x, y, 180);

      const total = 48;

      for (let index = 0; index < total; index++) {
        addPopup(index, total);
      }

      formationEnd = Math.max(
        ...popups.map(popup => popup.distance / POPUP_SPEED)
      );
    }

    function backToChoice() {
      mode = "choice";
      themeKey = "moon";
      theme = THEMES[themeKey];
      started = performance.now() / 1000;

      particles = [];
      popups = [];
      lastBurst = 0;
      formationEnd = 0;
    }

    function drawBackground(now) {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);

      gradient.addColorStop(
        0,
        `rgb(${theme.bg1[0]}, ${theme.bg1[1]}, ${theme.bg1[2]})`
      );

      gradient.addColorStop(
        1,
        `rgb(${theme.bg2[0]}, ${theme.bg2[1]}, ${theme.bg2[2]})`
      );

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      const moonX = W - 126 + Math.sin(now * 0.35) * 7;
      const moonY = 106 + Math.cos(now * 0.4) * 4;

      ctx.beginPath();
      ctx.arc(moonX, moonY, 48, 0, Math.PI * 2);
      ctx.fillStyle = "#fff4bd";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(moonX + 20, moonY - 14, 40, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${theme.bg1[0]}, ${theme.bg1[1]}, ${theme.bg1[2]})`;
      ctx.fill();

      for (let index = 0; index < 58; index++) {
        const x = (index * 137) % W;
        const y = 25 + ((index * 71) % 245);
        const size = 1.5 + Math.sin(now * 1.8 + index) * 0.8;

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = "#fff8d8";
        ctx.fill();
      }
    }

    function drawMainCard(key, x, y, width, height) {
      const cardTheme = THEMES[key];

      const hover = isInside(
        x,
        y,
        width,
        height,
        mouseX,
        mouseY
      );

      const lift = hover ? -6 : 0;

      roundedRect(
        x + 6,
        y + 7 + lift,
        width,
        height,
        11,
        "#17142a"
      );

      roundedRect(
        x,
        y + lift,
        width,
        height,
        11,
        cardTheme.card
      );

      ctx.fillStyle = cardTheme.accent;
      ctx.fillRect(x, y + lift, width, 7);

      ctx.fillStyle = "#2c2430";
      ctx.font = `bold 21px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(
        cardTheme.button,
        x + width / 2,
        y + 76 + lift
      );
    }

    function drawHiddenBackButton() {
      const [x, y, width, height] = backBtn;

      const hover = isInside(
        x,
        y,
        width,
        height,
        mouseX,
        mouseY
      );

      const lift = hover ? -3 : 0;

      ctx.globalAlpha = 0.85;

      ctx.fillStyle = "#17142a";
      ctx.fillRect(x + 3, y + 4 + lift, width, height);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y + lift, width, height);

      ctx.globalAlpha = 1;

      ctx.fillStyle = "#2c2430";
      ctx.font = `bold 11px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(
        "返回",
        x + width / 2,
        y + height / 2 + lift
      );
    }

    function drawChoice() {
      ctx.fillStyle = "#fff6cf";
      ctx.font = `bold 31px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("请做出你的选择", W / 2, 180);

      for (const card of mainCards) {
        drawMainCard(...card);
      }
    }

    function drawFooter(age) {
      const revealStart = formationEnd + 0.35;

      const progress = clamp(
        (age - revealStart) / FOOTER_REVEAL_TIME,
        0,
        1
      );

      const opacity = ease(progress);

      if (opacity <= 0) {
        return;
      }

      const footerY = H - 38 + (1 - opacity) * 18;
      const baseColor = theme.bg2;

      const shadowColor = blendColor(
        baseColor,
        "#1b1429",
        opacity * 0.78
      );

      const textColor = blendColor(
        baseColor,
        "#fff6cf",
        opacity
      );

      const lineWidth = 28 + 92 * opacity;
      const lineY = footerY - 25;

      ctx.strokeStyle = blendColor(
        baseColor,
        theme.accent,
        opacity
      );

      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2 - lineWidth, lineY);
      ctx.lineTo(W / 2 + lineWidth, lineY);
      ctx.stroke();

      ctx.fillStyle = theme.accent;

      ctx.beginPath();
      ctx.arc(
        W / 2 - lineWidth - 2,
        lineY,
        3,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.beginPath();
      ctx.arc(
        W / 2 + lineWidth + 2,
        lineY,
        3,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.font = `bold 17px ${FONT}`;
      ctx.textBaseline = "middle";

      ctx.fillStyle = shadowColor;
      ctx.fillText(
        theme.footer,
        W / 2 + 2,
        footerY + 2
      );

      ctx.fillStyle = textColor;
      ctx.fillText(
        theme.footer,
        W / 2,
        footerY
      );
    }

    function drawShow(now, dt) {
      const age = now - started;

      ctx.fillStyle = "#fff6cf";
      ctx.font = `bold 31px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(theme.title, W / 2, 84);

      if (
        now - lastBurst > 0.65 &&
        age < formationEnd + 1.5
      ) {
        lastBurst = now;
        firework(null, null, 35 + Math.floor(Math.random() * 24));
      }

      const aliveParticles = [];

      for (const particle of particles) {
        if (particle.update(dt)) {
          particle.draw();
          aliveParticles.push(particle);
        }
      }

      particles = aliveParticles;

      for (const popup of popups) {
        popup.update(age);
        popup.draw(age);
      }

      drawFooter(age);
      drawHiddenBackButton();
    }

    function render(now, dt) {
      ctx.clearRect(0, 0, W, H);
      drawBackground(now);

      if (mode === "choice") {
        drawChoice();
      } else {
        drawShow(now, dt);
      }
    }

    let previousTime = performance.now();

    function loop(currentTime) {
      const now = currentTime / 1000;
      const dt = Math.min((currentTime - previousTime) / 1000, 0.05);
      previousTime = currentTime;

      render(now, dt);
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("mousemove", event => {
      const point = getCanvasPoint(event);
      mouseX = point.x;
      mouseY = point.y;
    });

    canvas.addEventListener("mouseleave", () => {
      mouseX = -1;
      mouseY = -1;
    });

    canvas.addEventListener("click", event => {
      const point = getCanvasPoint(event);

      if (mode === "choice") {
        for (const [key, x, y, width, height] of mainCards) {
          if (isInside(x, y, width, height, point.x, point.y)) {
            startTheme(key, point.x, point.y);
            return;
          }
        }
      } else {
        const [x, y, width, height] = backBtn;

        if (isInside(x, y, width, height, point.x, point.y)) {
          backToChoice();
          return;
        }

        firework(point.x, point.y, 80);

        for (let i = 0; i < 4; i++) {
          addPopup();
        }
      }
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        window.close();
      }
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
